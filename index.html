<!DOCTYPE html><html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Website informasi MTsN 4 Kota Jambi. Temukan profil madrasah, informasi pendidikan, pendaftaran murid baru, berita, dan lokasi sekolah.">

<meta name="theme-color" content="#075c46">

<title>MTsN 4 Kota Jambi | Madrasah Unggul dan Berkarakter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
    :root {
        --green: #075c46;
        --green-dark: #043d30;
        --green-light: #eaf6ef;
        --gold: #e9bd64;
        --white: #ffffff;
        --text: #24332d;
        --muted: #6b7b73;
        --background: #f7faf7;
        --shadow: 0 12px 35px rgba(0, 50, 35, 0.09);
        --radius: 22px;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        scroll-behavior: smooth;
    }

    body {
        font-family: 'Poppins', sans-serif;
        color: var(--text);
        background: var(--white);
        line-height: 1.7;
        overflow-x: hidden;
    }

    a {
        color: inherit;
        text-decoration: none;
    }

    button {
        font: inherit;
    }

    img {
        display: block;
        max-width: 100%;
    }

    .container {
        width: min(1160px, 90%);
        margin: auto;
    }

    /* NAVBAR */

    .navbar {
        position: fixed;
        z-index: 1000;
        width: 100%;
        top: 0;
        left: 0;
        padding: 17px 0;
        transition: 0.3s;
    }

    .navbar.scrolled {
        background: rgba(255, 255, 255, 0.97);
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.07);
        padding: 11px 0;
        backdrop-filter: blur(15px);
    }

    .nav-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 25px;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        color: white;
    }

    .navbar.scrolled .logo {
        color: var(--green);
    }

    .logo-icon {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 15px;
        background: var(--gold);
        color: var(--green-dark);
        font-size: 23px;
    }

    .logo-text strong {
        display: block;
        font-size: 17px;
        line-height: 1.3;
    }

    .logo-text span {
        font-size: 10px;
        letter-spacing: 1.2px;
        opacity: 0.85;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: 25px;
        list-style: none;
    }

    .nav-links a {
        color: white;
        font-size: 12px;
        font-weight: 500;
        transition: 0.3s;
    }

    .navbar.scrolled .nav-links a {
        color: var(--text);
    }

    .nav-links a:hover {
        color: var(--gold) !important;
    }

    .nav-cta {
        background: var(--gold);
        color: var(--green-dark) !important;
        padding: 11px 18px;
        border-radius: 30px;
        font-weight: 700 !important;
    }

    .menu-toggle {
        display: none;
        background: transparent;
        border: 0;
        color: white;
        font-size: 24px;
        cursor: pointer;
    }

    .navbar.scrolled .menu-toggle {
        color: var(--green);
    }

    /* HERO */

    .hero {
        min-height: 740px;
        display: flex;
        align-items: center;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        background:
            linear-gradient(
                105deg,
                rgba(2, 42, 31, 0.96) 0%,
                rgba(4, 76, 55, 0.88) 50%,
                rgba(3, 65, 48, 0.45) 100%
            ),
            url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=2000&q=85')
            center/cover no-repeat;
    }

    .hero::before {
        content: "";
        position: absolute;
        width: 500px;
        height: 500px;
        border: 1px solid rgba(233, 189, 100, 0.25);
        border-radius: 50%;
        right: -150px;
        top: 100px;
        z-index: -1;
    }

    .hero::after {
        content: "";
        position: absolute;
        width: 350px;
        height: 350px;
        border: 1px solid rgba(233, 189, 100, 0.18);
        border-radius: 50%;
        right: -70px;
        top: 175px;
        z-index: -1;
    }

    .hero-content {
        padding-top: 90px;
        max-width: 760px;
        color: white;
    }

    .hero-label {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        border: 1px solid rgba(233, 189, 100, 0.55);
        background: rgba(255, 255, 255, 0.08);
        padding: 9px 16px;
        border-radius: 30px;
        font-size: 11px;
        letter-spacing: 1px;
        margin-bottom: 25px;
    }

    .hero-label i {
        color: var(--gold);
    }

    .hero h1 {
        font-family: 'Playfair Display', serif;
        font-size: clamp(42px, 6vw, 76px);
        line-height: 1.14;
        margin-bottom: 24px;
        font-weight: 800;
    }

    .hero h1 span {
        color: var(--gold);
    }

    .hero p {
        max-width: 610px;
        color: rgba(255, 255, 255, 0.83);
        font-size: 15px;
        line-height: 1.9;
        margin-bottom: 32px;
    }

    .hero-buttons {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
    }

    .btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        border: 0;
        padding: 15px 23px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 700;
        transition: 0.3s;
        cursor: pointer;
    }

    .btn-gold {
        background: var(--gold);
        color: var(--green-dark);
    }

    .btn-gold:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 25px rgba(233, 189, 100, 0.25);
    }

    .btn-outline {
        border: 1px solid rgba(255, 255, 255, 0.55);
        color: white;
        background: rgba(255, 255, 255, 0.06);
    }

    .btn-outline:hover {
        background: white;
        color: var(--green);
    }

    .hero-address {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 45px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 11px;
    }

    .hero-address i {
        color: var(--gold);
        font-size: 18px;
    }

    /* STATISTIK */

    .stats-wrap {
        position: relative;
        margin-top: -55px;
        z-index: 5;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        background: white;
        padding: 28px 18px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
    }

    .stat {
        text-align: center;
        padding: 8px 12px;
        border-right: 1px solid #e8eee9;
    }

    .stat:last-child {
        border-right: 0;
    }

    .stat i {
        color: var(--green);
        font-size: 23px;
        margin-bottom: 9px;
    }

    .stat h3 {
        font-size: 27px;
        color: var(--green);
        line-height: 1.4;
    }

    .stat p {
        font-size: 11px;
        color: var(--muted);
    }

    /* SECTION UMUM */

    section {
        padding: 100px 0;
        scroll-margin-top: 80px;
    }

    .section-heading {
        max-width: 700px;
        margin: 0 auto 50px;
        text-align: center;
    }

    .eyebrow {
        display: inline-block;
        color: var(--green);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 12px;
    }

    .section-heading h2 {
        font-family: 'Playfair Display', serif;
        font-size: clamp(30px, 4vw, 45px);
        line-height: 1.25;
        margin-bottom: 17px;
    }

    .section-heading h2 span {
        color: var(--green);
    }

    .section-heading p {
        font-size: 13px;
        color: var(--muted);
    }

    /* PROFIL */

    .about {
        background: var(--background);
    }

    .about-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 65px;
    }

    .about-image {
        position: relative;
    }

    .about-image img {
        width: 100%;
        height: 440px;
        object-fit: cover;
        border-radius: 25px;
        box-shadow: var(--shadow);
    }

    .image-badge {
        position: absolute;
        right: -20px;
        bottom: 28px;
        padding: 20px;
        background: var(--green);
        color: white;
        border-radius: 16px;
        box-shadow: var(--shadow);
    }

    .image-badge strong {
        display: block;
        color: var(--gold);
        font-size: 23px;
    }

    .image-badge span {
        font-size: 10px;
    }

    .about-content .eyebrow {
        margin-bottom: 10px;
    }

    .about-content h2 {
        font-family: 'Playfair Display', serif;
        font-size: clamp(30px, 4vw, 42px);
        line-height: 1.3;
        margin-bottom: 20px;
    }

    .about-content h2 span {
        color: var(--green);
    }

    .about-content > p {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 18px;
    }

    .feature-list {
        display: grid;
        gap: 15px;
        margin: 25px 0 30px;
    }

    .feature {
        display: flex;
        gap: 14px;
        align-items: flex-start;
    }

    .feature-icon {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        background: #dff0e5;
        color: var(--green);
        border-radius: 12px;
    }

    .feature h4 {
        font-size: 13px;
        margin-bottom: 3px;
    }

    .feature p {
        font-size: 11px;
        color: var(--muted);
    }

    /* INFORMASI */

    .info-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 23px;
    }

    .info-card {
        padding: 30px;
        border: 1px solid #e9efe9;
        border-radius: 18px;
        transition: 0.3s;
        background: white;
    }

    .info-card:hover {
        transform: translateY(-7px);
        box-shadow: var(--shadow);
        border-color: transparent;
    }

    .info-icon {
        width: 53px;
        height: 53px;
        display: grid;
        place-items: center;
        background: var(--green-light);
        color: var(--green);
        border-radius: 15px;
        font-size: 21px;
        margin-bottom: 20px;
    }

    .info-card h3 {
        font-size: 16px;
        margin-bottom: 12px;
    }

    .info-card p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.9;
    }

    .info-card a {
        display: inline-block;
        color: var(--green);
        font-size: 11px;
        font-weight: 700;
        margin-top: 18px;
    }

    /* IDENTITAS */

    .identity {
        background: var(--green-dark);
        color: white;
        position: relative;
        overflow: hidden;
    }

    .identity .section-heading h2 {
        color: white;
    }

    .identity .section-heading p {
        color: rgba(255, 255, 255, 0.68);
    }

    .identity .eyebrow {
        color: var(--gold);
    }

    .identity-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
    }

    .identity-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        padding: 18px 20px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.045);
    }

    .identity-row span {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.65);
    }

    .identity-row strong {
        text-align: right;
        font-size: 12px;
        max-width: 60%;
    }

    /* PPDB */

    .admission {
        background: var(--green-light);
    }

    .admission-box {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        align-items: center;
        gap: 45px;
        padding: 55px;
        background: white;
        border-radius: 25px;
        box-shadow: var(--shadow);
    }

    .admission-box h2 {
        font-family: 'Playfair Display', serif;
        font-size: clamp(29px, 4vw, 43px);
        line-height: 1.3;
        margin: 12px 0 18px;
    }

    .admission-box h2 span {
        color: var(--green);
    }

    .admission-box p {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 25px;
    }

    .admission-visual {
        min-height: 250px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background:
            radial-gradient(circle at 75% 25%, #e9bd64 0 8%, transparent 8.5%),
            linear-gradient(140deg, #075c46, #0b8763);
        color: white;
        text-align: center;
        padding: 25px;
    }

    .admission-visual i {
        font-size: 70px;
        color: var(--gold);
        margin-bottom: 20px;
    }

    .admission-visual h3 {
        font-size: 20px;
    }

    .admission-visual p {
        color: rgba(255, 255, 255, 0.8);
        margin: 8px 0 0;
        font-size: 11px;
    }

    /* BERITA */

    .news-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
    }

    .news-card {
        overflow: hidden;
        border-radius: 18px;
        border: 1px solid #edf0ed;
        background: white;
        transition: 0.3s;
    }

    .news-card:hover {
        transform: translateY(-6px);
        box-shadow: var(--shadow);
    }

    .news-image {
        height: 210px;
        overflow: hidden;
        background: var(--green-light);
    }

    .news-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: 0.5s;
    }

    .news-card:hover .news-image img {
        transform: scale(1.06);
    }

    .news-content {
        padding: 23px;
    }

    .news-tag {
        display: inline-block;
        font-size: 10px;
        color: var(--green);
        font-weight: 700;
        background: var(--green-light);
        padding: 5px 10px;
        border-radius: 30px;
        margin-bottom: 13px;
    }

    .news-content h3 {
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 10px;
    }

    .news-content p {
        font-size: 11px;
        color: var(--muted);
    }

    .news-content a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
        font-size: 11px;
        font-weight: 700;
        color: var(--green);
    }

    /* LOKASI */

    .location {
        background: var(--background);
    }

    .location-grid {
        display: grid;
        grid-template-columns: 0.8fr 1.2fr;
        gap: 30px;
    }

    .location-details {
        background: white;
        border-radius: 20px;
        padding: 32px;
        box-shadow: var(--shadow);
    }

    .location-details h3 {
        font-size: 21px;
        margin-bottom: 25px;
    }

    .contact-item {
        display: flex;
        gap: 15px;
        padding: 18px 0;
        border-bottom: 1px solid #edf0ed;
    }

    .contact-item:last-of-type {
        border-bottom: 0;
    }

    .contact-item i {
        color: var(--green);
        font-size: 18px;
        margin-top: 4px;
        width: 22px;
    }

    .contact-item strong {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
    }

    .contact-item p {
        color: var(--muted);
        font-size: 11px;
        overflow-wrap: anywhere;
    }

    .map-box {
        min-height: 470px;
        overflow: hidden;
        border-radius: 20px;
        box-shadow: var(--shadow);
        background: #e8eee9;
    }

    .map-box iframe {
        width: 100%;
        height: 100%;
        min-height: 470px;
        border: 0;
    }

    /* CTA */

    .cta {
        padding: 75px 0;
        background: var(--green);
        color: white;
        text-align: center;
    }

    .cta h2 {
        font-family: 'Playfair Display', serif;
        font-size: clamp(30px, 4vw, 44px);
        margin-bottom: 15px;
    }

    .cta p {
        max-width: 650px;
        margin: 0 auto 28px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.78);
    }

    /* FOOTER */

    footer {
        background: #022b21;
        color: white;
        padding: 55px 0 20px;
    }

    .footer-grid {
        display: grid;
        grid-template-columns: 1.3fr 0.7fr 1fr;
        gap: 45px;
        padding-bottom: 40px;
    }

    .footer-brand p {
        max-width: 340px;
        color: rgba(255, 255, 255, 0.65);
        font-size: 11px;
        margin-top: 20px;
        line-height: 2;
    }

    .footer-title {
        font-size: 14px;
        margin-bottom: 20px;
        color: var(--gold);
    }

    .footer-links {
        list-style: none;
    }

    .footer-links li {
        margin-bottom: 12px;
    }

    .footer-links a {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.7);
        transition: 0.3s;
    }

    .footer-links a:hover {
        color: var(--gold);
    }

    .socials {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    .socials a {
        width: 37px;
        height: 37px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        color: white;
        transition: 0.3s;
    }

    .socials a:hover {
        background: var(--gold);
        color: var(--green-dark);
    }

    .copyright {
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        padding-top: 22px;
        text-align: center;
        color: rgba(255, 255, 255, 0.55);
        font-size: 10px;
    }

    /* TOMBOL KEMBALI KE ATAS */

    .back-top {
        position: fixed;
        bottom: 25px;
        right: 22px;
        z-index: 900;
        width: 45px;
        height: 45px;
        display: grid;
        place-items: center;
        border: none;
        border-radius: 14px;
        background: var(--gold);
        color: var(--green-dark);
        cursor: pointer;
        box-shadow: var(--shadow);
        opacity: 0;
        visibility: hidden;
        transition: 0.3s;
    }

    .back-top.show {
        opacity: 1;
        visibility: visible;
    }

    /* ANIMASI */

    .reveal {
        opacity: 0;
        transform: translateY(25px);
        transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .reveal.visible {
        opacity: 1;
        transform: translateY(0);
    }

    /* RESPONSIVE */

    @media (max-width: 1000px) {
        .nav-links {
            gap: 14px;
        }

        .nav-links a {
            font-size: 11px;
        }

        .about-grid {
            gap: 40px;
        }

        .admission-box {
            padding: 35px;
        }
    }

    @media (max-width: 800px) {
        .navbar {
            padding: 12px 0;
        }

        .menu-toggle {
            display: block;
        }

        .nav-links {
            position: absolute;
            top: 100%;
            left: 5%;
            right: 5%;
            display: none;
            align-items: stretch;
            gap: 0;
            padding: 12px;
            background: white;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .nav-links.active {
            display: flex;
            flex-direction: column;
        }

        .nav-links li a {
            display: block;
